
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
#ctrl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;}
#ctrl-bar button{font-size:12px;padding:5px 13px;}
#ctrl-bar label{font-size:12px;color:var(--color-text-secondary);}
#hint{font-size:11px;color:var(--color-text-tertiary);margin-bottom:8px;}
#mode-label{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-left:auto;}
#p5host canvas{width:100%!important;height:auto!important;display:block;border-radius:10px;}
</style>

<div id="ctrl-bar">
  <button id="btnRegen">New pattern</button>
  <button id="btnMode">Switch mode</button>
  <label>Symmetry&nbsp;<input type="range" id="symSlider" min="3" max="16" value="6" step="1" style="width:70px;vertical-align:middle;">&nbsp;<span id="symVal">6</span></label>
  <span id="mode-label">Kaleidoscope</span>
</div>
<div id="hint">Click canvas → burst &nbsp;|&nbsp; R=regen &nbsp;G=glitch &nbsp;K/P/Z=mode &nbsp;← →=hue &nbsp;↑↓=speed</div>
<div id="p5host"></div>

<script>
const MODES = ['kaleidoscope','geometric','glitch'];
let modeIdx = 0, symCount = 6, colorShift = 0, glitching = false, glitchTimer = 0;
let params = {};

new p5(function(p) {
  let t = 0;
  const S = 500;

  function hsl(h,s,l,a){
    p.colorMode(p.HSL);
    let c = p.color(((h%360)+360)%360, s, l, a===undefined?255:a);
    p.colorMode(p.RGB);
    return c;
  }

  function rp() {
    return {
      baseHue:    p.random(360),
      hueSpread:  p.random(60,180),
      shapeCount: Math.floor(p.random(8,24)),
      speed:      p.random(0.004,0.016),
      layerCount: Math.floor(p.random(2,5)),
      scale:      p.random(0.7,1.2),
      twist:      p.random(0, p.TWO_PI),
      geoRows:    Math.floor(p.random(4,10)),
      geoCols:    Math.floor(p.random(4,10)),
      glitchAmp:  p.random(20,70),
      noiseScale: p.random(0.006,0.02),
    };
  }

  function drawKaleidoscope() {
    p.background(10,8,20);
    p.translate(S/2, S/2);
    const slices = symCount;
    const ang = p.TWO_PI / slices;
    for(let s=0;s<slices;s++){
      p.push();
      p.rotate(s*ang + params.twist + t*0.3);
      if(s%2===1) p.scale(1,-1);
      for(let L=0;L<params.layerCount;L++){
        let prog = L/params.layerCount;
        let r = (S*0.45*params.scale)*(1-prog*0.5);
        let hue = params.baseHue+colorShift+prog*params.hueSpread+t*40;
        for(let i=0;i<params.shapeCount;i++){
          let fi=i/params.shapeCount;
          let ox=p.cos(fi*p.TWO_PI+t*(1+L*0.3))*r*fi;
          let oy=p.sin(fi*p.TWO_PI*1.3+t*(0.7+L*0.2))*r*fi*0.5;
          let sz=(10+fi*25)*params.scale*(1-prog*0.3);
          p.noStroke();
          p.fill(hsl(hue+fi*60,70+prog*20,35+prog*25,170-prog*50));
          if(i%3===0) p.ellipse(ox,oy,sz,sz*0.6);
          else if(i%3===1){
            p.beginShape();
            for(let v=0;v<6;v++) p.vertex(ox+Math.cos(v/6*p.TWO_PI)*sz*0.5, oy+Math.sin(v/6*p.TWO_PI)*sz*0.5);
            p.endShape(p.CLOSE);
          } else {
            p.rect(ox-sz*0.3,oy-sz*0.3,sz*0.6,sz*0.6,2);
          }
        }
      }
      p.pop();
    }
    for(let r2=55;r2>0;r2-=10){
      p.noStroke();
      p.fill(hsl(params.baseHue+colorShift+t*60,80,50+r2*0.3,200-r2*2.5));
      p.ellipse(0,0,r2,r2);
    }
  }

  function drawGeometric() {
    p.background(8,6,16);
    const rows=params.geoRows, cols=params.geoCols;
    const cw=S/cols, ch=S/rows;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        let fi=(r*cols+c)/(rows*cols);
        let hue=params.baseHue+colorShift+fi*params.hueSpread+t*30+r*15+c*20;
        let wave=p.sin(t*2+r*0.7+c*0.5)*0.5+0.5;
        let x=c*cw, y=r*ch;
        p.noStroke();
        p.fill(hsl(hue,60+wave*30,20+wave*45,220));
        let kind=(r+c+Math.floor(t*2))%4;
        if(kind===0) p.rect(x+2,y+2,cw-4,ch-4,3);
        else if(kind===1) p.ellipse(x+cw/2,y+ch/2,cw-4,ch-4);
        else if(kind===2) p.triangle(x+cw/2,y+2,x+2,y+ch-2,x+cw-2,y+ch-2);
        else {
          p.beginShape();
          p.vertex(x+cw/2,y+2); p.vertex(x+cw-2,y+ch/2);
          p.vertex(x+cw/2,y+ch-2); p.vertex(x+2,y+ch/2);
          p.endShape(p.CLOSE);
        }
        p.stroke(hsl(hue+40,80,70,60)); p.strokeWeight(0.5); p.noFill();
        p.rect(x,y,cw,ch);
      }
    }
  }

  function drawGlitch() {
    p.background(5,5,10, glitching?180:25);
    let ns=params.noiseScale;
    for(let y=0;y<S;y+=3){
      let shift=glitching?p.random(-params.glitchAmp,params.glitchAmp):p.noise(y*ns,t*2)*50-25;
      let hue=params.baseHue+colorShift+y*0.2+t*50+shift;
      let lit=40+p.noise(y*ns*2,t)*30;
      p.noStroke();
      p.fill(hsl(hue,glitching?p.random(60,100):70,lit, glitching?p.random(100,255):130));
      let w=glitching?p.random(40,S):S;
      let x=glitching?p.random(-80,S-w):0;
      p.rect(x,y,w,3);
    }
    for(let y=0;y<S;y+=7){ p.fill(0,0,0,40); p.noStroke(); p.rect(0,y,S,1); }
    if(glitching){
      for(let b=0;b<6;b++){
        p.fill(hsl(params.baseHue+colorShift+p.random(180),100,60,p.random(80,200)));
        p.noStroke();
        p.rect(p.random(S),p.random(S),p.random(40,280),p.random(5,25));
      }
    }
  }

  p.setup = function(){
    let cnv = p.createCanvas(S, S);
    cnv.parent('p5host');
    params = rp();

    document.getElementById('btnRegen').onclick = ()=>{ params=rp(); };
    document.getElementById('btnMode').onclick = ()=>{
      modeIdx=(modeIdx+1)%MODES.length;
      document.getElementById('mode-label').textContent = MODES[modeIdx].charAt(0).toUpperCase()+MODES[modeIdx].slice(1);
    };
    document.getElementById('symSlider').oninput = function(){
      symCount=parseInt(this.value);
      document.getElementById('symVal').textContent=this.value;
    };
  };

  p.draw = function(){
    t += params.speed;
    if(glitchTimer>0){ glitchTimer--; } else { glitching=false; }
    p.push();
    if(MODES[modeIdx]==='kaleidoscope') drawKaleidoscope();
    else if(MODES[modeIdx]==='geometric') drawGeometric();
    else drawGlitch();
    p.pop();
  };

  p.mousePressed = function(){
    if(p.mouseX>=0&&p.mouseX<=p.width&&p.mouseY>=0&&p.mouseY<=p.height){
      if(MODES[modeIdx]==='glitch'){ glitching=true; glitchTimer=35; }
      else { params=rp(); }
    }
  };

  p.keyPressed = function(){
    if(p.key==='r'||p.key==='R') params=rp();
    else if(p.key==='g'||p.key==='G'){ glitching=true; glitchTimer=35; }
    else if(p.key==='k'||p.key==='K'){ modeIdx=0; document.getElementById('mode-label').textContent='Kaleidoscope'; }
    else if(p.key==='p'||p.key==='P'){ modeIdx=1; document.getElementById('mode-label').textContent='Geometric'; }
    else if(p.key==='z'||p.key==='Z'){ modeIdx=2; document.getElementById('mode-label').textContent='Glitch'; }
    else if(p.keyCode===p.LEFT_ARROW){ colorShift=(colorShift-30+360)%360; }
    else if(p.keyCode===p.RIGHT_ARROW){ colorShift=(colorShift+30)%360; }
    else if(p.keyCode===p.UP_ARROW){ params.speed=Math.min(params.speed+0.003,0.04); }
    else if(p.keyCode===p.DOWN_ARROW){ params.speed=Math.max(params.speed-0.003,0.001); }
  };

}, 'p5host');
</script>
